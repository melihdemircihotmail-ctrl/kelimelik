<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kelimelik</title>
<meta name="description" content="Kendi kelimelerinle aralıklı tekrar.">
<meta name="theme-color" content="#0F1619">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kelimelik">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#0F1619; --surface:#182329; --surface2:#1F2C33; --line:#2B3B43;
    --text:#E6EDF0; --dim:#8FA3AC; --paper:#F4EFE3; --paperEdge:#DED5C4;
    --ink:#1A1614; --brass:#E0A93B; --mint:#6FC2A0; --rose:#D2726F;
    --sans:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --nav:calc(58px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:16px;overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100%;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:var(--nav)}
  header{
    padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20
  }
  .brand{font-family:var(--serif);font-size:19px;letter-spacing:-.3px}
  main{flex:1;padding:16px;max-width:640px;width:100%;margin:0 auto}

  select,input,textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:12px;font-size:16px;font-family:var(--sans);outline:none
  }
  textarea{resize:vertical;line-height:1.55}
  select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{
    outline:2px solid var(--brass);outline-offset:2px}
  ::placeholder{color:#8FA3AC88}
  label span{display:block;color:var(--dim);font-size:13px;margin-bottom:6px}
  label{display:block;margin-bottom:16px}

  button{font-family:var(--sans);cursor:pointer;border-radius:11px;font-size:15px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .b-solid{background:var(--brass);color:#1A1409;border:1px solid var(--brass);padding:12px 16px;font-weight:600}
  .b-ghost{background:transparent;color:var(--text);border:1px solid var(--line);padding:12px 16px}
  .b-quiet{background:transparent;color:var(--dim);border:1px solid transparent;padding:9px}
  .b-danger{background:transparent;color:var(--rose);border:1px solid #D2726F55;padding:12px 16px}
  .b-wide{width:100%;padding:15px}
  .row{display:flex;gap:8px;flex-wrap:wrap}

  /* --- kart --- */
  .stage{perspective:1400px;touch-action:pan-y}
  .card{position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.25,1);
    min-height:56vh}
  .card.back{transform:rotateY(180deg)}
  .face{
    background:var(--paper);border:1px solid var(--paperEdge);border-radius:18px;
    min-height:56vh;padding:30px 24px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    box-shadow:0 20px 36px -24px #000;
    backface-visibility:hidden;-webkit-backface-visibility:hidden
  }
  .face.b{position:absolute;inset:0;transform:rotateY(180deg)}
  .word{font-family:var(--serif);font-size:34px;line-height:1.25;color:var(--ink);word-break:break-word}
  .word.sm{font-size:27px}
  .hint{margin-top:16px;font-size:13px;color:#8B8071}
  .ex{margin-top:16px;padding-top:14px;border-top:1px solid var(--paperEdge);
    font-size:15px;line-height:1.6;color:#6E6357;font-style:italic;max-width:420px}
  .say{margin-top:16px;background:transparent;border:1px solid var(--paperEdge);color:#6E6357;
    border-radius:999px;padding:8px 14px;font-size:13px}

  .grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
  .g{border-radius:12px;padding:13px 4px;flex-direction:column;gap:2px;border-width:1px;border-style:solid}
  .g b{font-size:14.5px;font-weight:600}
  .g i{font-size:11.5px;opacity:.72;font-style:normal}
  .g1{background:#D2726F14;border-color:#D2726F55;color:var(--rose)}
  .g2{background:#E0A93B14;border-color:#E0A93B55;color:var(--brass)}
  .g3{background:#6FC2A014;border-color:#6FC2A055;color:var(--mint)}

  .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:12px}

  /* --- liste --- */
  .list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .item{padding:13px 14px;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
  .item+.item{border-top:1px solid var(--line)}
  .item .f{font-size:15.5px;font-weight:500}
  .item .k{font-size:14.5px;color:var(--dim);margin-top:2px}
  .item .e{font-size:13.5px;color:#8FA3ACcc;margin-top:5px;font-style:italic}
  .item .s{font-size:12px;color:#8FA3AC99;margin-top:6px}
  .grow{flex:1;min-width:0}

  .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .tile .n{font-family:var(--serif);font-size:26px}
  .tile .l{font-size:13px;color:var(--dim);margin-top:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:112px}
  .bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .bars .bar{width:100%;background:var(--line);border-radius:5px}
  .bars .t{font-size:11.5px;color:var(--dim)}
  p.note{color:var(--dim);font-size:13.5px;line-height:1.7}

  /* --- alt menü --- */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)
  }
  nav button{flex:1;flex-direction:column;gap:3px;background:none;border:none;
    color:var(--dim);padding:9px 0 8px;font-size:11px;border-radius:0}
  nav button.on{color:var(--text)}
  nav button.on .d{background:var(--brass)}
  nav .d{width:18px;height:2px;border-radius:2px;background:transparent}
  nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}

  #toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(var(--nav) + 14px);background:var(--surface2);border:1px solid var(--line);
    color:var(--text);padding:11px 18px;border-radius:999px;font-size:14px;z-index:50;
    max-width:86%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}

  .empty{text-align:center;padding:56px 16px;color:var(--dim);font-size:15px;line-height:1.7}
  .hidden{display:none !important}
  .sheet{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  @media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">Kelimelik</span>
    <select id="deckSel" style="width:auto;flex:1;padding:8px 10px;font-size:14px;background:var(--surface2)"></select>
    <button class="b-quiet" id="deckBtn" aria-label="Deste ayarları">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V7a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v11z"/><path d="M12 11v6M9 14h6"/></svg>
    </button>
    <button class="b-quiet" id="revBtn" aria-label="Ters çevir">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
  </header>
  <main id="main"></main>
</div>

<nav id="nav"></nav>
<div id="toast"></div>

<script>
/* ============ veri ============ */
var DAY = 86400000, KEY = 'kelimelik-v1';
var S = { decks: [], cards: [], active: null, newLimit: 20, reverse: false };
var view = 'study', queue = [], flipped = false, doneCount = 0, editing = null;

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var d = JSON.parse(raw);
      S.decks = d.decks || []; S.cards = d.cards || [];
      S.active = d.active; S.newLimit = d.newLimit || 20; S.reverse = !!d.reverse; }
  } catch(e){}
  if (!S.decks.length) {
    var id = uid();
    S.decks = [{ id:id, name:'İngilizce', lang:'en-US' }];
    S.active = id;
    S.cards = [
      mk(id,'resilience','dayanıklılık, direnç','Social resilience depends on strong family ties.'),
      mk(id,'threshold','eşik, sınır değeri','The threshold for intervention was lowered.'),
      mk(id,'to advocate','savunmak, öne çıkarmak','She advocates for stronger child protection laws.')
    ];
    save();
  }
  if (!S.decks.some(function(d){ return d.id === S.active; })) S.active = S.decks[0].id;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Kaydedilemedi. Cihaz depolaması dolu olabilir.'); }
}
function mk(deckId, front, back, ex){
  return { id:uid(), deckId:deckId, front:front, back:back, example:ex||'',
    ease:2.5, interval:0, reps:0, lapses:0, status:'new', due:Date.now(), created:Date.now() };
}
function deck(){ return S.decks.filter(function(d){ return d.id===S.active; })[0]; }
function myCards(){ return S.cards.filter(function(c){ return c.deckId===S.active; }); }

/* ============ aralıklı tekrar ============ */
function schedule(c, grade, now){
  var o = {}; for (var k in c) o[k]=c[k];
  var ease = o.ease || 2.5;
  if (grade === 'again'){
    o.ease = Math.max(1.3, ease-0.2); o.interval = 0; o.reps = 0;
    o.lapses = (o.lapses||0)+1; o.status = 'learning'; o.due = now; return o;
  }
  var reps = (o.reps||0)+1, iv;
  if (grade === 'good'){
    iv = (o.status==='new'||o.status==='learning') ? (reps<=1?1:3)
       : Math.max(1, Math.round((o.interval||1)*ease));
  } else {
    ease = Math.min(3.2, ease+0.15);
    iv = (o.status==='new'||o.status==='learning') ? 4
       : Math.max(1, Math.round((o.interval||1)*ease*1.3));
  }
  o.ease = ease; o.reps = reps; o.interval = Math.min(iv,365);
  o.status = 'review'; o.due = now + o.interval*DAY;
  return o;
}
function ivLabel(c, grade){
  if (grade==='again') return 'birazdan';
  var i = schedule(c, grade, Date.now()).interval;
  if (i < 30) return i + ' gün';
  if (i < 365) return Math.round(i/30) + ' ay';
  return (i/365).toFixed(1) + ' yıl';
}

/* ============ arayüz yardımcıları ============ */
var tEl = document.getElementById('toast'), tTimer;
function toast(msg){
  tEl.textContent = msg; tEl.classList.add('show');
  clearTimeout(tTimer); tTimer = setTimeout(function(){ tEl.classList.remove('show'); }, 2600);
}
function speak(text){
  var d = deck();
  if (!d || !d.lang || !window.speechSynthesis || !text) return;
  try { speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = d.lang; u.rate = .92;
    speechSynthesis.speak(u);
  } catch(e){}
}
function go(v){ view = v; flipped = false; editing = null; render(); window.scrollTo(0,0); }

/* ============ oturum kuyruğu ============ */
function build(){
  var now = Date.now(), all = myCards();
  var due = all.filter(function(c){ return c.status!=='new' && c.due<=now; });
  var fresh = all.filter(function(c){ return c.status==='new'; }).slice(0, S.newLimit);
  queue = due.concat(fresh).sort(function(){ return Math.random()-.5; })
             .map(function(c){ return c.id; });
  flipped = false;
}
function answer(grade){
  var c = S.cards.filter(function(x){ return x.id===queue[0]; })[0];
  if (!c) return;
  var upd = schedule(c, grade, Date.now());
  for (var k in upd) c[k] = upd[k];
  queue = grade==='again' ? queue.slice(1).concat([c.id]) : queue.slice(1);
  flipped = false; doneCount++; save(); render();
}

/* ============ ekranlar ============ */
function render(){
  var d = deck();
  document.getElementById('deckSel').innerHTML = S.decks.map(function(x){
    return '<option value="'+x.id+'"'+(x.id===S.active?' selected':'')+'>'+esc(x.name)+'</option>'; }).join('');
  document.getElementById('revBtn').style.color = S.reverse ? 'var(--brass)' : 'var(--dim)';
  renderNav();
  var m = document.getElementById('main');
  if (!d) { m.innerHTML = '<div class="empty">Deste yok.</div>'; return; }
  if (view==='study') study(m);
  else if (view==='add') addView(m);
  else if (view==='list') listView(m);
  else statsView(m);
}

var NAVS = [
  ['study','Çalış','<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>'],
  ['add','Ekle','<path d="M12 5v14M5 12h14"/>'],
  ['list','Kartlar','<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/>'],
  ['stats','Durum','<path d="M5 20V10M12 20V4M19 20v-7"/>']
];
function renderNav(){
  document.getElementById('nav').innerHTML = NAVS.map(function(n){
    return '<button class="'+(view===n[0]?'on':'')+'" data-go="'+n[0]+'">'+
      '<svg viewBox="0 0 24 24">'+n[2]+'</svg><span>'+n[1]+'</span><span class="d"></span></button>';
  }).join('');
}

/* ---- çalış ---- */
function study(m){
  var all = myCards();
  if (!all.length){
    m.innerHTML = '<div class="empty"><p>Bu deste boş. Çalışmaya başlamak için birkaç kelime ekle.</p>'+
      '<button class="b-solid" data-go="add" style="margin-top:16px">Kelime ekle</button></div>';
    return;
  }
  if (!queue.length) build();
  var c = S.cards.filter(function(x){ return x.id===queue[0]; })[0];

  if (!c){
    var next = all.filter(function(x){ return x.status==='review'; })
                  .sort(function(a,b){ return a.due-b.due; })[0];
    var kalan = next ? Math.max(1, Math.ceil((next.due-Date.now())/DAY)) : null;
    m.innerHTML = '<div class="empty">'+
      '<div style="font-family:var(--serif);font-size:26px;color:var(--text);margin-bottom:10px">Bugünlük bitti</div>'+
      '<p>'+(doneCount? 'Bu oturumda '+doneCount+' kart çalıştın. ':'')+
      (kalan? 'Sıradaki tekrar '+kalan+' gün sonra.':'Yeni kart eklersen hemen devam edebilirsin.')+'</p>'+
      '<div class="row" style="justify-content:center;margin-top:18px">'+
      '<button class="b-ghost" data-act="again-session">Baştan çalış</button>'+
      '<button class="b-solid" data-go="add">Kelime ekle</button></div></div>';
    return;
  }

  var st = counts(all);
  var face = S.reverse ? c.back : c.front;
  var rev  = S.reverse ? c.front : c.back;

  m.innerHTML =
   '<div class="meta"><span>Sırada '+queue.length+' kart</span>'+
   '<span><span style="color:var(--brass)">'+st.yeni+' yeni</span> &nbsp; '+
   '<span style="color:var(--mint)">'+st.tekrar+' tekrar</span></span></div>'+
   '<div class="stage" id="stage"><div class="card'+(flipped?' back':'')+'" id="card">'+
     '<div class="face"><div class="word">'+esc(face)+'</div>'+
       '<div class="hint">Çevirmek için dokun</div></div>'+
     '<div class="face b"><div class="word sm">'+esc(rev)+'</div>'+
       (c.example? '<div class="ex">'+esc(c.example)+'</div>':'')+
       (deck().lang? '<button class="say" data-act="say">Dinle</button>':'')+
     '</div>'+
   '</div></div>'+
   (flipped
     ? '<div class="grades">'+
       g('again','g1','Bilemedim',ivLabel(c,'again'))+
       g('good','g2','Zorlandım',ivLabel(c,'good'))+
       g('easy','g3','Biliyordum',ivLabel(c,'easy'))+'</div>'
     : '<button class="b-solid b-wide" style="margin-top:14px" data-act="flip">Cevabı göster</button>');

  swipe(document.getElementById('stage'), c);
}
function g(grade, cls, label, hint){
  return '<button class="g '+cls+'" data-grade="'+grade+'"><b>'+label+'</b><i>'+hint+'</i></button>';
}
function counts(all){
  var now = Date.now();
  return {
    total: all.length,
    yeni: all.filter(function(c){ return c.status==='new'; }).length,
    ogren: all.filter(function(c){ return c.status==='learning'; }).length,
    tekrar: all.filter(function(c){ return c.status==='review' && c.due<=now; }).length,
    oturmus: all.filter(function(c){ return c.status==='review' && c.interval>=21; }).length
  };
}
/* kaydırma: sağa = biliyordum, sola = bilemedim */
function swipe(el, card){
  if (!el) return;
  var x0=0, y0=0, dx=0, dy=0, on=false;
  el.addEventListener('touchstart', function(e){
    var t = e.touches[0]; x0=t.clientX; y0=t.clientY; dx=0; dy=0; on=true;
    el.firstChild.style.transition='none';
  }, {passive:true});
  el.addEventListener('touchmove', function(e){
    if(!on) return; var t=e.touches[0]; dx=t.clientX-x0; dy=t.clientY-y0;
    if (!flipped || Math.abs(dx) < Math.abs(dy)) return;
    el.firstChild.style.transform = 'rotateY('+(flipped?180:0)+'deg) translateX('+(flipped?-dx:dx)+'px) rotate('+(dx/28)+'deg)';
    el.firstChild.style.opacity = String(1 - Math.min(.55, Math.abs(dx)/420));
  }, {passive:true});
  el.addEventListener('touchend', function(){
    if(!on) return; on=false;
    var c = el.firstChild;
    c.style.transition=''; c.style.transform=''; c.style.opacity='';
    if (flipped && Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy)) answer(dx>0?'easy':'again');
  });
}

/* ---- ekle ---- */
var addMode = 'tek';
function addView(m){
  m.innerHTML =
   '<div class="row" style="margin-bottom:18px">'+
     '<button class="'+(addMode==='tek'?'b-solid':'b-ghost')+'" data-act="mode-tek">Tek tek</button>'+
     '<button class="'+(addMode==='toplu'?'b-solid':'b-ghost')+'" data-act="mode-toplu">Listeden</button>'+
   '</div>'+
   (addMode==='tek'
    ? '<label><span>Kelime — '+esc(deck().name)+'</span><input id="aF" placeholder="resilience" autocapitalize="none"></label>'+
      '<label><span>Anlamı</span><input id="aB" placeholder="dayanıklılık, direnç"></label>'+
      '<label><span>Örnek cümle — isteğe bağlı</span><textarea id="aE" rows="3" placeholder="Social resilience depends on strong family ties."></textarea></label>'+
      '<button class="b-solid b-wide" data-act="save-one">Ekle ve devam et</button>'
    : '<label><span>Her satıra bir kelime yaz</span>'+
      '<textarea id="aBulk" rows="10" autocapitalize="none" placeholder="resilience = dayanıklılık&#10;threshold = eşik = The threshold was lowered.&#10;advocate - savunmak"></textarea></label>'+
      '<p class="note">Ayırıcı olarak = ; | tab ya da boşluklu tire kullanabilirsin. Üçüncü bölüm örnek cümle sayılır.</p>'+
      '<button class="b-solid b-wide" data-act="save-bulk">Listeyi ekle</button>');
}
function saveOne(){
  var f = document.getElementById('aF').value.trim();
  var b = document.getElementById('aB').value.trim();
  var e = document.getElementById('aE').value.trim();
  if (!f || !b){ toast('Kelime ve anlamı boş olamaz.'); return; }
  S.cards.unshift(mk(S.active, f, b, e)); save();
  document.getElementById('aF').value=''; document.getElementById('aB').value='';
  document.getElementById('aE').value=''; document.getElementById('aF').focus();
  queue = []; toast('Kart eklendi.');
}
function saveBulk(){
  var rows = document.getElementById('aBulk').value.split('\n'), n = 0;
  for (var i=0;i<rows.length;i++){
    var p = rows[i].trim(); if (!p) continue;
    var parts = p.split(/\t|\s*[=;|]\s*|\s+[-–]\s+/);
    if (parts.length < 2) continue;
    var f = parts[0].trim(), b = parts[1].trim();
    if (!f || !b) continue;
    S.cards.unshift(mk(S.active, f, b, parts.slice(2).join(' ').trim())); n++;
  }
  if (!n){ toast('Hiçbir satır ayrıştırılamadı. Her satırda ayırıcı kullan.'); return; }
  save(); queue = []; toast(n+' kart eklendi.'); go('study');
}

/* ---- kartlar ---- */
var search = '';
function listView(m){
  var all = myCards();
  if (!all.length){ m.innerHTML = '<div class="empty">Bu destede henüz kart yok.</div>'; return; }
  var q = search.trim().toLocaleLowerCase('tr');
  var f = (q ? all.filter(function(c){
      return (c.front+' '+c.back+' '+(c.example||'')).toLocaleLowerCase('tr').indexOf(q)>-1; }) : all)
      .sort(function(a,b){ return b.created-a.created; });

  m.innerHTML =
   '<input id="q" placeholder="'+all.length+' kart içinde ara" value="'+esc(search)+'" style="margin-bottom:14px">'+
   '<div class="list">'+ (f.length ? f.map(function(c){
      if (editing === c.id) return itemEdit(c);
      return '<div class="item"><div class="grow">'+
        '<div class="f">'+esc(c.front)+'</div><div class="k">'+esc(c.back)+'</div>'+
        (c.example? '<div class="e">'+esc(c.example)+'</div>':'')+
        '<div class="s">'+(c.status==='new'?'yeni':c.status==='learning'?'öğreniliyor':
           c.interval+' günde bir · '+c.reps+' tekrar')+'</div></div>'+
        '<button class="b-quiet" data-edit="'+c.id+'" aria-label="Düzenle">'+
          '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg></button>'+
        '<button class="b-quiet" data-del="'+c.id+'" style="color:var(--rose)" aria-label="Sil">'+
          '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>'+
        '</div>';
   }).join('') : '<div class="item" style="justify-content:center;color:var(--dim)">Eşleşen kart yok.</div>')+'</div>';
}
function itemEdit(c){
  return '<div class="item"><div class="grow">'+
    '<input id="eF" value="'+esc(c.front)+'" style="margin-bottom:8px">'+
    '<input id="eB" value="'+esc(c.back)+'" style="margin-bottom:8px">'+
    '<textarea id="eE" rows="2" placeholder="Örnek cümle" style="margin-bottom:8px">'+esc(c.example||'')+'</textarea>'+
    '<div class="row"><button class="b-solid" data-act="commit">Kaydet</button>'+
    '<button class="b-ghost" data-act="cancel">Vazgeç</button></div></div></div>';
}

/* ---- durum ---- */
function statsView(m){
  var all = myCards(), st = counts(all), now = Date.now(), b = [0,0,0,0,0,0,0];
  all.forEach(function(c){ if (c.status!=='review') return;
    var d = Math.floor((c.due-now)/DAY); if (d>=0 && d<7) b[d]++; });
  var max = Math.max.apply(null, b.concat([1]));
  var tiles = [['Toplam kart',st.total,'var(--text)'],['Yeni',st.yeni,'var(--brass)'],
    ['Öğreniliyor',st.ogren,'var(--rose)'],['Bugün tekrar',st.tekrar,'var(--mint)'],
    ['Oturmuş (21+ gün)',st.oturmus,'var(--mint)']];

  m.innerHTML =
   '<div class="grid2" style="margin-bottom:24px">'+ tiles.map(function(t){
     return '<div class="tile"><div class="n" style="color:'+t[2]+'">'+t[1]+'</div><div class="l">'+t[0]+'</div></div>';
   }).join('') +'</div>'+
   '<div class="l" style="font-size:14px;color:var(--dim);margin-bottom:12px">Önümüzdeki yedi günün tekrar yükü</div>'+
   '<div class="bars" style="margin-bottom:26px">'+ b.map(function(n,i){
     return '<div><div class="t" style="color:'+(n?'var(--text)':'transparent')+'">'+(n||0)+'</div>'+
     '<div class="bar" style="height:'+Math.max(3,(n/max)*74)+'px;'+(n?'background:var(--mint);opacity:.85':'')+'"></div>'+
     '<div class="t">'+(i===0?'bugün':'+'+i)+'</div></div>'; }).join('') +'</div>'+
   '<div class="tile" style="margin-bottom:14px">'+
     '<label style="margin-bottom:8px"><span>Bir oturumdaki yeni kart sayısı: '+S.newLimit+'</span>'+
     '<input type="range" min="5" max="60" step="5" value="'+S.newLimit+'" id="lim" style="padding:0;accent-color:var(--brass)"></label>'+
     '<p class="note" style="margin:0">Kartlar bildikçe daha seyrek, unuttukça daha sık gelir.</p></div>'+
   '<div class="tile">'+
     '<div style="font-size:14px;margin-bottom:4px">Yedekleme</div>'+
     '<p class="note">Kartların bu telefonda saklanıyor. Ara sıra yedek indir; başka bir cihaza da böyle taşırsın.</p>'+
     '<div class="row"><button class="b-ghost" data-act="export">Yedeği indir</button>'+
     '<button class="b-ghost" data-act="import">Yedekten yükle</button></div>'+
     '<input type="file" id="file" accept=".json,application/json" class="hidden"></div>';
}

/* ---- deste yönetimi ---- */
var LANGS = [['en-US','İngilizce'],['ar-SA','Arapça'],['de-DE','Almanca'],['fr-FR','Fransızca'],
  ['es-ES','İspanyolca'],['ru-RU','Rusça'],['tr-TR','Türkçe'],['','Belirtme']];
function deckSheet(){
  var m = document.getElementById('main');
  if (document.getElementById('sheet')) { render(); return; }
  var h = '<div class="sheet" id="sheet">'+
    '<label><span>Yeni deste adı</span><input id="dName" placeholder="ör. Akademik İngilizce"></label>'+
    '<label><span>Seslendirme dili</span><select id="dLang">'+
      LANGS.map(function(l){ return '<option value="'+l[0]+'">'+l[1]+'</option>'; }).join('')+'</select></label>'+
    '<div class="row"><button class="b-solid" data-act="deck-new">Deste oluştur</button>'+
    '<button class="b-danger" data-act="deck-del">Bu desteyi sil</button>'+
    '<button class="b-ghost" data-act="deck-close">Kapat</button></div></div>';
  m.insertAdjacentHTML('afterbegin', h);
}

/* ============ olaylar ============ */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-go],[data-act],[data-grade],[data-edit],[data-del]');
  if (!t) {
    if (e.target.closest('#card')) { flipped = !flipped; render(); }
    return;
  }
  var a = t.dataset;
  if (a.go) return go(a.go);
  if (a.grade) return answer(a.grade);
  if (a.edit){ editing = a.edit; return render(); }
  if (a.del){
    S.cards = S.cards.filter(function(c){ return c.id!==a.del; });
    queue = queue.filter(function(q){ return q!==a.del; }); save(); return render();
  }
  switch(a.act){
    case 'flip': flipped = true; return render();
    case 'say': e.stopPropagation();
      var cur = S.cards.filter(function(x){ return x.id===queue[0]; })[0];
      return cur && speak(cur.front);
    case 'again-session': doneCount=0; build(); return render();
    case 'mode-tek': addMode='tek'; return render();
    case 'mode-toplu': addMode='toplu'; return render();
    case 'save-one': return saveOne();
    case 'save-bulk': return saveBulk();
    case 'commit': {
      var c = S.cards.filter(function(x){ return x.id===editing; })[0];
      var f = document.getElementById('eF').value.trim(), b = document.getElementById('eB').value.trim();
      if (!f || !b){ toast('Kelime ve anlamı boş olamaz.'); return; }
      c.front=f; c.back=b; c.example=document.getElementById('eE').value.trim();
      editing=null; save(); return render();
    }
    case 'cancel': editing=null; return render();
    case 'deck-new': {
      var n = document.getElementById('dName').value.trim();
      if (!n){ toast('Desteye bir ad ver.'); return; }
      var nd = { id:uid(), name:n, lang:document.getElementById('dLang').value };
      S.decks.push(nd); S.active = nd.id; queue=[]; save(); addMode='tek'; return go('add');
    }
    case 'deck-del': {
      if (S.decks.length<=1){ toast('Son desteyi silemezsin.'); return; }
      S.cards = S.cards.filter(function(c){ return c.deckId!==S.active; });
      S.decks = S.decks.filter(function(d){ return d.id!==S.active; });
      S.active = S.decks[0].id; queue=[]; save(); toast('Deste silindi.'); return go('study');
    }
    case 'deck-close': return render();
    case 'export': {
      var blob = new Blob([JSON.stringify({decks:S.decks,cards:S.cards},null,2)],{type:'application/json'});
      var url = URL.createObjectURL(blob), a2 = document.createElement('a');
      a2.href = url; a2.download = 'kelimelik-yedek-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a2); a2.click(); a2.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return toast('Yedek indirildi.');
    }
    case 'import': return document.getElementById('file').click();
  }
});

document.addEventListener('change', function(e){
  if (e.target.id === 'deckSel'){ S.active = e.target.value; queue=[]; doneCount=0; save(); render(); }
  if (e.target.id === 'lim'){ S.newLimit = Number(e.target.value); save(); render(); }
  if (e.target.id === 'file'){
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var d = JSON.parse(r.result);
        if (!Array.isArray(d.decks) || !Array.isArray(d.cards)) throw 0;
        S.decks = d.decks; S.cards = d.cards; S.active = d.decks[0].id;
        queue=[]; save(); toast('Yedek geri yüklendi.'); go('study');
      } catch(err){ toast('Bu dosya geçerli bir Kelimelik yedeği değil.'); }
    };
    r.readAsText(f);
  }
});
document.addEventListener('input', function(e){
  if (e.target.id === 'q'){ search = e.target.value;
    var pos = e.target.selectionStart; listView(document.getElementById('main'));
    var q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos,pos); }
});
document.addEventListener('keydown', function(e){
  if (view!=='study' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.code==='Space'){ e.preventDefault(); flipped=!flipped; render(); }
  else if (flipped && e.key==='1') answer('again');
  else if (flipped && e.key==='2') answer('good');
  else if (flipped && e.key==='3') answer('easy');
});
document.getElementById('deckBtn').addEventListener('click', deckSheet);
document.getElementById('revBtn').addEventListener('click', function(){
  S.reverse = !S.reverse; queue=[]; flipped=false; save(); render();
  toast(S.reverse ? 'Önce anlam gösterilecek.' : 'Önce kelime gösterilecek.');
});

load(); render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
