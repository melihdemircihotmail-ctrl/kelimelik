<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kelimelik</title>
<meta name="description" content="Kendi kelimelerinle aralıklı tekrar.">
<meta name="theme-color" content="#0F1619">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kelimelik">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#0F1619; --surface:#182329; --surface2:#1F2C33; --line:#2B3B43;
    --text:#E6EDF0; --dim:#8FA3AC; --paper:#F4EFE3; --paperEdge:#DED5C4;
    --ink:#1A1614; --brass:#E0A93B; --mint:#6FC2A0; --rose:#D2726F;
    --sans:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --nav:calc(58px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;
    overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
  #app{min-height:100%;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:var(--nav)}
  header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);
    display:flex;align-items:center;gap:9px;position:sticky;top:0;z-index:20}
  .brand{font-family:var(--serif);font-size:19px;letter-spacing:-.3px}
  main{flex:1;padding:16px;max-width:640px;width:100%;margin:0 auto}

  select,input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:12px;font-size:16px;font-family:var(--sans);outline:none}
  textarea{resize:vertical;line-height:1.55}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  ::placeholder{color:#8FA3AC88}
  label span{display:block;color:var(--dim);font-size:13px;margin-bottom:6px}
  label{display:block;margin-bottom:16px}

  button{font-family:var(--sans);cursor:pointer;border-radius:11px;font-size:15px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .b-solid{background:var(--brass);color:#1A1409;border:1px solid var(--brass);padding:12px 16px;font-weight:600}
  .b-ghost{background:transparent;color:var(--text);border:1px solid var(--line);padding:12px 16px}
  .b-quiet{background:transparent;color:var(--dim);border:1px solid transparent;padding:9px}
  .b-danger{background:transparent;color:var(--rose);border:1px solid #D2726F55;padding:12px 16px}
  .b-wide{width:100%;padding:15px}
  .row{display:flex;gap:8px;flex-wrap:wrap}

  .modes{display:flex;gap:5px;margin-bottom:10px}
  .modes button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--dim);
    padding:9px 2px;font-size:12.5px;border-radius:10px}
  .modes button.on{background:var(--surface2);color:var(--text);border-color:var(--brass)}

  .kademe{background:var(--surface);border:1px solid var(--line);border-radius:11px;
    padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:var(--dim)}
  .kademe .t{display:flex;justify-content:space-between;margin-bottom:7px;gap:8px}
  .track{height:4px;background:var(--line);border-radius:3px;overflow:hidden}
  .fill{height:100%;background:var(--mint);border-radius:3px}

  .stage{perspective:1400px;touch-action:pan-y}
  .card{position:relative;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.8,.25,1);min-height:50vh}
  .card.back{transform:rotateY(180deg)}
  .face,.panel{background:var(--paper);border:1px solid var(--paperEdge);border-radius:18px;
    min-height:50vh;padding:24px 18px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;box-shadow:0 20px 36px -24px #000}
  .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face.b{position:absolute;inset:0;transform:rotateY(180deg)}
  .word{font-family:var(--serif);font-size:33px;line-height:1.25;color:var(--ink);word-break:break-word}
  .word.sm{font-size:26px}
  .simge{font-size:46px;line-height:1;margin-bottom:12px}
  .hint{margin-top:14px;font-size:12.5px;color:#9A8F7E}
  .ex{margin-top:14px;padding-top:13px;border-top:1px solid var(--paperEdge);
    font-size:15px;line-height:1.6;color:#6E6357;font-style:italic;max-width:420px}
  .ex b{color:#A08A55;font-style:normal;letter-spacing:1px}
  .ex .tr{display:block;margin-top:7px;font-style:normal;color:#8A8071;font-size:14px}
  .say{margin-top:12px;background:#fff;border:1px solid var(--paperEdge);
    color:#6E6357;border-radius:999px;padding:8px 15px;font-size:13px}
  .say.mini{margin-top:9px;padding:6px 12px;font-size:12px;background:transparent}
  .ask{font-size:12.5px;color:#9A8F7E;margin-bottom:10px;letter-spacing:.3px}
  .panel input{background:#fff;border:1px solid var(--paperEdge);color:var(--ink);
    font-size:20px;text-align:center;font-family:var(--serif);max-width:340px}
  .verdict{margin-top:14px;font-size:15px;line-height:1.6}
  .ok{color:#3E7D5E} .no{color:#A94B48}
  .answer{font-family:var(--serif);font-size:25px;color:var(--ink);margin-top:6px}
  .yours{font-size:14px;color:#A94B48;margin-top:4px;text-decoration:line-through}

  .opts{display:flex;flex-direction:column;gap:8px;width:100%;max-width:380px;margin-top:18px}
  .opt{background:#fff;border:1px solid var(--paperEdge);color:var(--ink);
    padding:14px 12px;font-size:16px;border-radius:12px;text-align:center;line-height:1.35}
  .opt.dogru{background:#DFF0E5;border-color:#7FB79A;color:#2E5C46}
  .opt.yanlis{background:#F6E0DE;border-color:#C9908D;color:#8A3F3C}
  .opt.solgun{opacity:.45}

  .bigsay{width:106px;height:106px;border-radius:50%;background:#fff;
    border:1px solid var(--paperEdge);color:#6E6357;font-size:14px;flex-direction:column;gap:2px}
  .slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:18px}
  .slot{width:32px;height:42px;border-bottom:2px solid #C9BFAC;display:flex;align-items:center;
    justify-content:center;font-family:var(--serif);font-size:23px;color:var(--ink);cursor:pointer}
  .slot.sp{border:none;width:13px}
  .pool{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .chip{width:39px;height:45px;border-radius:9px;background:#fff;border:1px solid var(--paperEdge);
    color:var(--ink);font-family:var(--serif);font-size:22px;box-shadow:0 2px 0 #D9CFBC}
  .chip.used{opacity:.22;pointer-events:none;box-shadow:none}
  .picks{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 16px}
  .picks button{background:var(--surface);border:1px solid var(--line);padding:7px 9px;font-size:19px;border-radius:9px}

  .grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .grades.two{grid-template-columns:1fr 1fr}
  .g{border-radius:12px;padding:12px 4px;flex-direction:column;gap:2px;border-width:1px;border-style:solid}
  .g b{font-size:14.5px;font-weight:600}
  .g i{font-size:11.5px;opacity:.72;font-style:normal}
  .g1{background:#D2726F14;border-color:#D2726F55;color:var(--rose)}
  .g2{background:#E0A93B14;border-color:#E0A93B55;color:var(--brass)}
  .g3{background:#6FC2A014;border-color:#6FC2A055;color:var(--mint)}

  .meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
    color:var(--dim);margin-bottom:10px;gap:8px}
  .rozet{background:var(--surface2);border:1px solid var(--line);border-radius:999px;
    padding:3px 9px;font-size:11.5px;color:var(--dim)}
  .yildiz{background:none;border:none;font-size:19px;padding:2px 6px;line-height:1;color:#C9BFAC}
  .yildiz.on{color:var(--brass)}

  .list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .item{padding:13px 14px;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
  .item+.item{border-top:1px solid var(--line)}
  .item .f{font-size:15.5px;font-weight:500}
  .item .k{font-size:14.5px;color:var(--dim);margin-top:2px}
  .item .e{font-size:13.5px;color:#8FA3ACcc;margin-top:5px;font-style:italic}
  .item .s{font-size:12px;color:#8FA3AC99;margin-top:6px}
  .em{font-size:22px;line-height:1.2}
  .grow{flex:1;min-width:0}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .tile .n{font-family:var(--serif);font-size:26px}
  .tile .l{font-size:13px;color:var(--dim);margin-top:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:112px}
  .bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .bars .bar{width:100%;background:var(--line);border-radius:5px}
  .bars .t{font-size:11.5px;color:var(--dim)}
  p.note{color:var(--dim);font-size:13.5px;line-height:1.7}
  .sec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;
    background:var(--surface);display:flex;gap:10px;align-items:center}
  .sec .grow{font-size:14px}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;flex-direction:column;gap:3px;background:none;border:none;color:var(--dim);
    padding:9px 0 8px;font-size:11px;border-radius:0}
  nav button.on{color:var(--text)}
  nav button.on .d{background:var(--brass)}
  nav .d{width:18px;height:2px;border-radius:2px;background:transparent}
  nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 14px);
    background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:11px 18px;
    border-radius:999px;font-size:14px;z-index:50;max-width:86%;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
  .empty{text-align:center;padding:46px 16px;color:var(--dim);font-size:15px;line-height:1.7}
  .hidden{display:none !important}
  .sheet{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;
    border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.card{transition:none}.spin{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">Kelimelik</span>
    <select id="deckSel" style="width:auto;flex:1;padding:8px 10px;font-size:14px;background:var(--surface2)"></select>
    <button class="b-quiet" id="deckBtn" aria-label="Deste ayarları">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V7a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v11z"/><path d="M12 11v6M9 14h6"/></svg></button>
    <button class="b-quiet" id="revBtn" aria-label="Ters çevir">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
  </header>
  <main id="main"></main>
</div>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
/* ================= veri ================= */
var DAY=86400000, KEY='kelimelik-v1';
var VARMODEL={ gemini:'gemini-2.5-flash', anthropic:'claude-haiku-4-5-20251001' };
var S={ decks:[], cards:[], active:null, batch:20, reverse:false, mode:'akilli', goal:20,
        streak:{gun:'',bugun:0,seri:0,sonHedef:''},
        ai:{saglayici:'gemini',key:'',model:'gemini-2.5-flash'} };
var view='study', queue=[], flipped=false, shown=false, doneCount=0, editing=null;
var typedOK=null, yazilan='', harf=null, harfKey='', mcq=null, mcqKey='';
var busy=false, tanitildi={}, ipucu=0, retype=false;
var enr={run:false,done:0,total:0,fail:0,cancel:false};
var sess={dogru:0,yanlis:0,zor:[],basla:Date.now(),bitti:false};
var sinav=null, cikar=null;

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function gunKey(t){ var d=new Date(t||Date.now());
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

function load(){
  try{ var raw=localStorage.getItem(KEY);
    if(raw){ var d=JSON.parse(raw);
      S.decks=d.decks||[]; S.cards=d.cards||[]; S.active=d.active;
      S.batch=d.batch||d.newLimit||20; S.reverse=!!d.reverse; S.mode=d.mode||'akilli';
      S.goal=d.goal||20;
      if(d.streak) S.streak=d.streak;
      if(d.ai){
        S.ai.key=d.ai.key||'';
        S.ai.saglayici=d.ai.saglayici || ((d.ai.key||'').indexOf('sk-ant')===0?'anthropic':'gemini');
        S.ai.model=d.ai.model || VARMODEL[S.ai.saglayici];
      } }
  }catch(e){}
  S.cards.forEach(function(c){
    if(c.emoji===undefined) c.emoji='';
    if(c.exTr===undefined) c.exTr='';
    if(c.star===undefined) c.star=false;
  });
  if(!S.decks.length){
    var id=uid();
    S.decks=[{id:id,name:'İngilizce',lang:'en-US'}]; S.active=id;
    S.cards=[ mk(id,'resilience','dayanıklılık','Social resilience depends on strong family ties.','🌿','Toplumsal dayanıklılık güçlü aile bağlarına dayanır.'),
              mk(id,'threshold','eşik','The threshold for intervention was lowered.','🚪','Müdahale eşiği aşağı çekildi.'),
              mk(id,'to advocate','savunmak','She advocates for stronger child protection laws.','📢','Daha güçlü çocuk koruma yasalarını savunuyor.') ];
    save();
  }
  if(!S.decks.some(function(d){return d.id===S.active;})) S.active=S.decks[0].id;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast('Kaydedilemedi. Cihaz depolaması dolu olabilir.'); } }
function mk(deckId,f,b,ex,em,tr){ return {id:uid(),deckId:deckId,front:f,back:b,example:ex||'',
  exTr:tr||'',emoji:em||'',star:false,
  ease:2.5,interval:0,reps:0,lapses:0,status:'new',due:Date.now(),created:Date.now()}; }
function deck(){ return S.decks.filter(function(d){return d.id===S.active;})[0]; }
function myCards(){ return S.cards.filter(function(c){return c.deckId===S.active;}); }
function cur(){ return S.cards.filter(function(x){return x.id===queue[0];})[0]; }
function byId(id){ return S.cards.filter(function(x){return x.id===id;})[0]; }

/* ============ SM-2 ============ */
var Q={again:1,good:3,easy:5};
function schedule(c,grade,now){
  var o={}; for(var k in c) o[k]=c[k];
  var q=Q[grade], ef=o.ease||2.5;
  ef=Math.max(1.3, ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  o.ease=Math.round(ef*100)/100;
  if(q<3){ o.reps=0; o.interval=0; o.lapses=(o.lapses||0)+1;
    o.status='learning'; o.due=now; return o; }
  var reps=(o.reps||0)+1;
  o.interval = reps===1?1: reps===2?6: Math.max(1,Math.round((o.interval||1)*o.ease));
  o.interval=Math.min(o.interval,365);
  o.reps=reps; o.status='review'; o.due=now+o.interval*DAY;
  return o;
}
function ivLabel(c,grade){
  if(grade==='again') return 'birazdan';
  var i=schedule(c,grade,Date.now()).interval;
  if(i<30) return i+' gün';
  if(i<365) return Math.round(i/30)+' ay';
  return (i/365).toFixed(1)+' yıl';
}

/* ============ kademe ============ */
function ezber(c){ return c.status==='review' && c.reps>=2; }
function zorMu(c){ return (c.lapses||0)>=2 || c.star; }
function ordered(){ return myCards().slice().sort(function(a,b){return a.created-b.created;}); }
function batchInfo(){
  var all=ordered(), size=S.batch||20, n=Math.ceil(all.length/size);
  for(var i=0;i<n;i++){
    var sl=all.slice(i*size,(i+1)*size);
    if(!sl.every(ezber)) return {i:i,cards:sl,done:sl.filter(ezber).length,size:sl.length,
      locked:Math.max(0,all.length-(i+1)*size),allDone:false};
  }
  var last=Math.max(0,n-1), sl2=all.slice(last*size);
  return {i:last,cards:sl2,done:sl2.length,size:sl2.length,locked:0,allDone:true};
}

/* ============ yardimcilar ============ */
var tEl=document.getElementById('toast'), tTimer;
function toast(m){ tEl.textContent=m; tEl.classList.add('show');
  clearTimeout(tTimer); tTimer=setTimeout(function(){ tEl.classList.remove('show'); },3200); }
function speak(text){
  var d=deck();
  if(!d||!d.lang||!window.speechSynthesis||!text) return;
  try{ speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang=d.lang; u.rate=.9; speechSynthesis.speak(u);
  }catch(e){}
}
function go(v){ view=v; resetCardState(); render(); window.scrollTo(0,0); }
function resetCardState(){ flipped=false; shown=false; typedOK=null; yazilan=''; harf=null; harfKey='';
  mcq=null; mcqKey=''; editing=null; ipucu=0; retype=false; }
function norm(s){ return String(s||'').toLocaleLowerCase('tr')
  .replace(/[.,;:!?"'()\[\]\-–_]/g,' ').replace(/\s+/g,' ').trim(); }
function alts(s){ return String(s||'').split(/[,;/]| veya /).map(norm).filter(Boolean); }
var FOLD={'ı':'i','i':'i','İ':'i','ş':'s','ğ':'g','ü':'u','ö':'o','ç':'c',
          'â':'a','î':'i','û':'u','é':'e','ñ':'n','ß':'s'};
function fold(s){ return String(s||'').replace(/[ıiİşğüöçâîûéñß]/g,function(m){return FOLD[m]||m;}); }
function lev(a,b){
  var m=a.length,n=b.length,i,j,prev=[],curr=[];
  if(!m) return n; if(!n) return m;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){ curr[0]=i;
    for(j=1;j<=n;j++) curr[j]=Math.min(prev[j]+1,curr[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=curr.slice(); }
  return prev[n];
}
function checkTyped(input,expected){
  var a=norm(input); if(!a) return false;
  var list=alts(expected);
  if(list.indexOf(a)>-1) return true;
  var fa=fold(a), fl=list.map(fold);
  if(fl.indexOf(fa)>-1) return true;
  for(var i=0;i<fl.length;i++) if(lev(fa,fl[i])<=1) return 'near';
  return false;
}
function firstAlt(s){ return String(s||'').split(/[,;/]/)[0].trim(); }
function askSide(c){ return S.reverse?c.back:c.front; }
function ansSide(c){ return S.reverse?c.front:c.back; }
function rx(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function maskEx(text,word){
  if(!text||!word) return esc(text||'');
  var core=String(word).replace(/^to\s+/i,'').trim().split(/\s+/).pop();
  if(core.length<3) return esc(text);
  var stem=core.length>5?core.slice(0,core.length-2):core;
  return esc(text).replace(new RegExp(rx(esc(stem))+'[\\wçğıöşüÇĞİÖŞÜ]*','gi'),'<b>____</b>');
}
function exHTML(c,where){
  if(!c.example && !c.exTr) return '';
  if(where==='front-hide'){
    if(c.exTr) return '<div class="ex">'+esc(c.exTr)+'</div>';
    return c.example?'<div class="ex">'+maskEx(c.example,c.front)+'</div>':'';
  }
  if(where==='front') return c.example?'<div class="ex">'+esc(c.example)+'</div>':'';
  return '<div class="ex">'+esc(c.example)+(c.exTr?'<span class="tr">'+esc(c.exTr)+'</span>':'')+'</div>';
}
function karistir(a){ return a.slice().sort(function(){return Math.random()-.5;}); }

/* ============ gunluk hedef ============ */
function sayacArtir(){
  var t=gunKey();
  if(S.streak.gun!==t){ S.streak.gun=t; S.streak.bugun=0; }
  S.streak.bugun++;
  if(S.streak.bugun===S.goal){
    var dun=gunKey(Date.now()-DAY);
    S.streak.seri = (S.streak.sonHedef===dun) ? (S.streak.seri||0)+1 : 1;
    S.streak.sonHedef=t;
    toast('Günlük hedef tamam. '+S.streak.seri+' günlük seri.');
  }
}
function bugunSayi(){ return S.streak.gun===gunKey() ? S.streak.bugun : 0; }

/* ============ oturum ============ */
function build(){
  var now=Date.now(), bi=batchInfo();
  var due=myCards().filter(function(c){ return c.status!=='new' && c.due<=now; });
  var fresh=bi.cards.filter(function(c){ return c.status==='new'; });
  queue=karistir(due.concat(fresh)).map(function(c){return c.id;});
  tanitildi={}; sess={dogru:0,yanlis:0,zor:[],basla:Date.now(),bitti:false};
  resetCardState();
}
function answer(grade){
  var c=cur(); if(!c) return;
  var once=batchInfo().i;
  if(grade==='again'){ sess.yanlis++; if(sess.zor.indexOf(c.id)<0) sess.zor.push(c.id); }
  else sess.dogru++;
  var u=schedule(c,grade,Date.now()); for(var k in u) c[k]=u[k];
  queue = grade==='again' ? queue.slice(1).concat([c.id]) : queue.slice(1);
  resetCardState(); doneCount++; sayacArtir(); save();
  var bi=batchInfo();
  if(bi.i>once && !bi.allDone){ queue=[]; toast('Kademe '+(once+1)+' tamam. '+bi.size+' yeni kelime açıldı.'); }
  render();
}

/* ============ soru tipi secimi ============ */
function yeterliSik(){ return myCards().length>=4; }
function qType(c){
  if(c.status==='new' && !tanitildi[c.id]) return 'tanit';
  if(S.mode!=='akilli') return S.mode;
  var r=c.reps||0;
  if(r<=1) return yeterliSik()?'secme':'kart';
  if(r<=3) return 'harf';
  if(deck().lang && r%3===0) return 'dinle';
  return 'yaz';
}

/* ---------- calis ---------- */
function kademeBar(){
  var bi=batchInfo();
  if(!bi.size) return '';
  var pct=Math.round(bi.done/bi.size*100);
  return '<div class="kademe"><div class="t">'+
    '<span>Kademe '+(bi.i+1)+' — '+bi.done+'/'+bi.size+' ezberlendi</span>'+
    '<span>'+(bi.locked?bi.locked+' kilitli':bi.allDone?'hepsi açık':'')+'</span>'+
    '</div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>';
}
function hedefBar(){
  var b=bugunSayi(), pct=Math.min(100,Math.round(b/Math.max(1,S.goal)*100));
  return '<div class="kademe"><div class="t">'+
    '<span>Bugün '+b+'/'+S.goal+' kart</span>'+
    '<span>'+(S.streak.seri?'🔥 '+S.streak.seri+' günlük seri':'')+'</span>'+
    '</div><div class="track"><div class="fill" style="width:'+pct+'%;background:var(--brass)"></div></div></div>';
}
function durumRozet(c){
  if(c.status==='new') return 'yeni';
  if(c.status==='learning') return 'öğreniliyor';
  if(ezber(c)) return c.interval+' günde bir';
  return 'pekişiyor';
}
function study(m){
  if(sinav) return sinavCiz(m);
  var all=myCards();
  if(!all.length){ m.innerHTML='<div class="empty"><p>Bu deste boş. Çalışmaya başlamak için birkaç kelime ekle.</p>'+
    '<button class="b-solid" data-go="add" style="margin-top:16px">Kelime ekle</button></div>'; return; }
  if(!queue.length && !sess.bitti) build();
  var c=cur();
  if(!c) return ozetCiz(m,all);
  var t=qType(c);
  var head='<div class="modes">'+MODES.map(function(x){
      return '<button class="'+(S.mode===x[0]?'on':'')+'" data-mode="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>'+
    enrichBar(false)+hedefBar()+kademeBar()+
    '<div class="meta"><span>Sırada '+queue.length+'</span>'+
    '<span class="rozet">'+durumRozet(c)+'</span>'+
    '<button class="yildiz'+(c.star?' on':'')+'" data-act="star" aria-label="Zor işaretle">'+(c.star?'★':'☆')+'</button></div>';
  var body = t==='tanit'?paneTanit(c) : t==='secme'?paneSecme(c) : t==='yaz'?paneYaz(c)
           : t==='dinle'?paneDinle(c) : t==='harf'?paneHarf(c) : paneKart(c);
  m.innerHTML=head+body;
  if(t==='kart') swipe(document.getElementById('stage'));
  if(t==='yaz'&&!shown){ var i=document.getElementById('typed'); if(i) i.focus(); }
  if(t==='yaz'&&shown&&retype){ var r=document.getElementById('retype'); if(r) r.focus(); }
  if((t==='dinle'||t==='tanit')&&!shown) speak(c.front);
}

      zorlar.map(function(c){ return '<div style="font-size:14.5px;padding:4px 0">'+

/* --- coktan secmeli --- */
function secmeKur(c){
  var dogru=ansSide(c);
  var havuz=myCards().filter(function(x){ return x.id!==c.id && norm(ansSide(x))!==norm(dogru); });
  var yanlislar=karistir(havuz).slice(0,3).map(ansSide);
  mcq={ secenekler:karistir([dogru].concat(yanlislar)), dogru:dogru, secilen:null };
  mcqKey=c.id+S.reverse;
}
function paneSecme(c){
  if(mcqKey!==c.id+S.reverse) secmeKur(c);
  var secildi=mcq.secilen!==null;
  return '<div class="panel"><div class="ask">Doğru karşılığı seç</div>'+simge(c)+
    '<div class="word sm">'+esc(askSide(c))+'</div>'+sayBtn(c)+
    (secildi?exHTML(c,'back'):exHTML(c,S.reverse?'front-hide':'front'))+
    '<div class="opts">'+mcq.secenekler.map(function(o,i){
      var cls='opt';
      if(secildi){
        if(norm(o)===norm(mcq.dogru)) cls+=' dogru';
        else if(i===mcq.secilen) cls+=' yanlis';
        else cls+=' solgun';
      }
      return '<button class="'+cls+'" data-opt="'+i+'">'+esc(o)+'</button>';}).join('')+'</div></div>'+
    (secildi?gradesAfterCheck(c, norm(mcq.secenekler[mcq.secilen])===norm(mcq.dogru)):'');
}

    '</div>';
  if(retype) return govde+'<button class="b-solid b-wide" style="margin-top:12px" data-act="retype-ok">Yazdım, devam</button>';

}

    '<button class="say" data-act="say">🔊 Tekrar</button></div>'+grades3(c);

/* --- harf --- */
function harfInit(c){
  var target=firstAlt(ansSide(c)), chars=Array.from(target);
  harf={ target:target,
    slots:chars.map(function(ch){return ch.trim()===''?{sp:true}:{ch:'',from:-1};}),
    pool:karistir(chars.filter(function(ch){return ch.trim()!=='';})
      .map(function(ch){return {ch:ch,used:false};})) };
  harfKey=c.id+S.reverse;
}
function paneHarf(c){
  if(harfKey!==c.id+S.reverse) harfInit(c);
  if(shown){
    var v=typedOK?'<div class="verdict ok">Doğru.</div>':'<div class="verdict no">Olmadı.</div>';
    return '<div class="panel"><div class="ask">'+esc(askSide(c))+'</div>'+
      '<div class="answer">'+esc(ansSide(c))+'</div>'+v+exHTML(c,'back')+sayBtn(c)+'</div>'+
      gradesAfterCheck(c,typedOK);
  }
  return '<div class="panel"><div class="ask">'+(S.reverse?'Harflerden yabancı kelimeyi kur':'Harflerden karşılığını kur')+'</div>'+
    simge(c)+'<div class="word sm" style="margin-bottom:8px">'+esc(askSide(c))+'</div>'+
    sayBtn(c)+exHTML(c,S.reverse?'front-hide':'front')+
    '<div class="slots" style="margin-top:16px">'+harf.slots.map(function(s,i){
      return s.sp?'<div class="slot sp"></div>':'<div class="slot" data-slot="'+i+'">'+esc(s.ch)+'</div>';}).join('')+'</div>'+
    '<div class="pool">'+harf.pool.map(function(p,i){
      return '<button class="chip'+(p.used?' used':'')+'" data-chip="'+i+'">'+esc(p.ch)+'</button>';}).join('')+'</div></div>'+
    '<div class="row" style="margin-top:12px">'+
    '<button class="b-ghost" style="flex:1" data-act="harf-clear">Temizle</button>'+
    '<button class="b-ghost" style="flex:1" data-act="harf-give">Pas geç</button></div>';
}
function harfPlace(i){
  if(!harf) return;
  var p=harf.pool[i]; if(!p||p.used) return;
  for(var s=0;s<harf.slots.length;s++){
    if(!harf.slots[s].sp&&!harf.slots[s].ch){ harf.slots[s]={ch:p.ch,from:i}; p.used=true; break; } }
  if(harf.slots.every(function(s){return s.sp||s.ch;})){
    var built=harf.slots.map(function(s){return s.sp?' ':s.ch;}).join('');
    typedOK=norm(built)===norm(harf.target); shown=true;
    if(typedOK){ var c=cur(); if(c&&deck().lang) speak(c.front); }
  }
  render();
}
function harfPull(i){
  if(!harf) return;
  var s=harf.slots[i]; if(!s||s.sp||!s.ch) return;
  if(s.from>-1) harf.pool[s.from].used=false;
  harf.slots[i]={ch:'',from:-1}; render();
}
function swipe(el){
  if(!el) return;
  var x0=0,y0=0,dx=0,dy=0,on=false;
  el.addEventListener('touchstart',function(e){ var t=e.touches[0];
    x0=t.clientX; y0=t.clientY; dx=0; dy=0; on=true; el.firstChild.style.transition='none'; },{passive:true});
  el.addEventListener('touchmove',function(e){ if(!on) return;
    var t=e.touches[0]; dx=t.clientX-x0; dy=t.clientY-y0;
    if(!flipped||Math.abs(dx)<Math.abs(dy)) return;
    el.firstChild.style.transform='rotateY(180deg) translateX('+(-dx)+'px) rotate('+(dx/28)+'deg)';
    el.firstChild.style.opacity=String(1-Math.min(.55,Math.abs(dx)/420)); },{passive:true});
  el.addEventListener('touchend',function(){ if(!on) return; on=false;
    var c=el.firstChild; c.style.transition=''; c.style.transform=''; c.style.opacity='';
    if(flipped&&Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)) answer(dx>0?'easy':'again'); });
}

/* ============ kademe sinavi ============ */
function sinavBasla(){
  var bi=batchInfo();
  var liste=bi.cards.filter(function(c){ return c.status!=='new'; });
  if(liste.length<4){ toast('Sınav için en az 4 çalışılmış kelime gerekiyor.'); return; }
  sinav={ ids:karistir(liste).map(function(c){return c.id;}), i:0, dogru:0, yanlis:[],
          cevap:null, secenek:null, kademe:bi.i+1 };
  view='study'; render();
}
function sinavSoru(){
  var c=byId(sinav.ids[sinav.i]);
  if(!c) return null;
  if(!sinav.secenek || sinav.secenekId!==c.id){
    var dogru=ansSide(c);
    var havuz=myCards().filter(function(x){ return x.id!==c.id && norm(ansSide(x))!==norm(dogru); });
    sinav.secenek=karistir([dogru].concat(karistir(havuz).slice(0,3).map(ansSide)));
    sinav.secenekId=c.id;
  }
  return c;
}
function sinavCiz(m){
  if(sinav.i>=sinav.ids.length){
    var puan=Math.round(sinav.dogru/sinav.ids.length*100);
    var yanlislar=sinav.yanlis.map(byId).filter(Boolean);
    m.innerHTML='<div class="empty" style="padding-top:26px">'+
      '<div style="font-family:var(--serif);font-size:30px;color:'+(puan>=80?'var(--mint)':puan>=50?'var(--brass)':'var(--rose)')+'">%'+puan+'</div>'+
      '<div style="font-size:15px;color:var(--text);margin:8px 0 16px">Kademe '+sinav.kademe+' sınavı — '+
        sinav.dogru+'/'+sinav.ids.length+' doğru</div>'+

function eksikler(){ return myCards().filter(function(c){ return !c.example||!c.exTr||!c.emoji; }); }
function parcala(arr,n){ var o=[]; for(var i=0;i<arr.length;i+=n) o.push(arr.slice(i,i+n)); return o; }
function enrichBar(showIdle){
  if(enr.run){
    var pct=Math.round(enr.done/Math.max(1,enr.total)*100);
    return '<div class="kademe"><div class="t">'+
      '<span>Örnekler üretiliyor — '+enr.done+'/'+enr.total+(enr.fail?' · '+enr.fail+' atlandı':'')+'</span>'+
      '<span><button class="b-quiet" style="padding:0;color:var(--rose);font-size:12.5px" data-act="enr-stop">durdur</button></span>'+
      '</div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>';
  }
  if(!showIdle) return '';
  var n=eksikler().length;
  if(!n) return '';
  return '<div class="kademe"><div class="t"><span>'+n+' kartta örnek cümle, çeviri ya da simge eksik</span></div>'+
    '<button class="b-solid b-wide" style="padding:10px;margin-top:4px" data-act="enr-start">Yapay zekâ ile hepsini tamamla</button></div>';
}
function apiCagir(prompt,maxTok){
  return S.ai.saglayici==='gemini' ? geminiCagir(prompt,maxTok) : claudeCagir(prompt,maxTok);
}
function jsonCoz(txt){
  txt=String(txt||'').replace(/```json|```/g,'').trim();
  if(!txt) throw new Error('bos yanit');
  return JSON.parse(txt);
}
function claudeCagir(prompt,maxTok){
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':S.ai.key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.ai.model,max_tokens:maxTok||1200,messages:[{role:'user',content:prompt}]})
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+' '+t.slice(0,100)); });
    return r.json();
  }).then(function(d){
    return jsonCoz((d.content||[]).filter(function(b){return b.type==='text';})
      .map(function(b){return b.text;}).join(''));
  });
}
function geminiCagir(prompt,maxTok){
  var url='https://generativelanguage.googleapis.com/v1beta/models/'+
    encodeURIComponent(S.ai.model)+':generateContent';
  return fetch(url,{
    method:'POST',
    headers:{'content-type':'application/json','x-goog-api-key':S.ai.key},
    body:JSON.stringify({ contents:[{parts:[{text:prompt}]}],
      generationConfig:{ maxOutputTokens:maxTok||1200, temperature:0.7,
        responseMimeType:'application/json' } })
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+' '+t.slice(0,100)); });
    return r.json();
  }).then(function(d){
    var c=(d.candidates||[])[0];
    return jsonCoz(((c&&c.content&&c.content.parts)||[]).map(function(x){return x.text||'';}).join(''));
  });
}
/* ucretsiz katmanin dakikalik istek siniri dar, gruplar arasi daha uzun bekliyoruz */
function bekleme(){ return S.ai.saglayici==='gemini' ? 6500 : 500; }
function apiHata(e){
  var m=String(e&&e.message||e);
  if(m.indexOf('401')>-1||m.indexOf('403')>-1) return 'API anahtarı kabul edilmedi.';
  if(m.indexOf('429')>-1) return 'Ücretsiz katmanın sınırına takıldın. Birkaç dakika sonra tekrar dene.';
  if(m.indexOf('404')>-1) return 'Model adı tanınmadı. Durum sekmesinden düzelt.';
  return 'İşlem tamamlanamadı. Bağlantını ve anahtarı kontrol et.';
}
function enrichAsk(grp){
  var L=langName();
  var lines=grp.map(function(c,i){ return (i+1)+'. '+c.front+' — '+c.back; }).join('\n');
  return apiCagir('Aşağıda '+L+' kelimeler ve Türkçe anlamları var. Her biri için şunları üret:\n'+
    'ornek: kelimeyi doğal biçimde kullanan tek bir '+L+' cümle, en fazla 14 kelime.\n'+
    'ceviri: o cümlenin akıcı Türkçesi.\n'+
    'simge: kelimeyi çağrıştıran tek bir emoji.\n'+
    'Verilen Türkçe anlama sadık kal. Listedeki sırayı koru.\n'+
    'Sadece JSON dizisi döndür, başka hiçbir şey yazma:\n'+
    '[{"ornek":"...","ceviri":"...","simge":"..."}]\n\nKelimeler:\n'+lines, 2000)
  .then(function(arr){ if(!Array.isArray(arr)) throw new Error('bicim'); return arr; });
}
function enrichDene(grp,hak){
  return enrichAsk(grp).catch(function(e){
    if(hak>0) return new Promise(function(r){setTimeout(r,bekleme()+2000);}).then(function(){ return enrichDene(grp,hak-1); });
    throw e;
  });
}
function enrichRun(){
  if(enr.run) return;
  if(!S.ai.key){ toast('Önce Durum sekmesinden API anahtarını gir.'); return; }
  var list=eksikler();
  if(!list.length){ toast('Eksik kart yok.'); return; }
  enr={run:true,done:0,total:list.length,fail:0,cancel:false};
  var gruplar=parcala(list,8), i=0;
  render();
  function bitir(){
    var f=enr.fail; enr.run=false; render();
    toast(enr.cancel?'Durduruldu. '+enr.done+' kart işlendi.'
      : f?enr.total-f+' kart dolduruldu, '+f+' tanesi atlandı.'
         :enr.total+' kartın hepsi dolduruldu.');
  }
  function sonraki(){
    if(enr.cancel||i>=gruplar.length){ bitir(); return; }
    var grp=gruplar[i++];
    enrichDene(grp,1).then(function(arr){
      grp.forEach(function(c,j){
        var o=arr[j]; if(!o) return;
        if(!c.example&&o.ornek) c.example=String(o.ornek).trim();
        if(!c.exTr&&o.ceviri) c.exTr=String(o.ceviri).trim();
        if(!c.emoji&&o.simge) c.emoji=String(o.simge).trim().slice(0,4);
      });
    }).catch(function(){ enr.fail+=grp.length; })
    .then(function(){ enr.done=Math.min(enr.total,enr.done+grp.length); save(); render(); setTimeout(sonraki,bekleme()); });
  }
  sonraki();
}

    S.cards.unshift(mk(S.active,f,b,(parts[2]||'').trim(),'',parts.slice(3).join(' ').trim())); n++;

  if(!n){ toast('Hiçbir satır ayrıştırılamadı. Her satırda ayırıcı kullan.'); return; }

    '<input id="eM" maxlength="4" value="'+esc(c.emoji||'')+'" placeholder="Simge" style="margin-bottom:8px">'+
    '<div class="row"><button class="b-solid" data-act="commit">Kaydet</button>'+
    '<button class="b-ghost" data-act="cancel">Vazgeç</button>'+
    '<button class="b-ghost" data-act="reset-card">Sıfırla</button></div></div></div>';
}

/* ---------- durum ---------- */
function statsView(m){
  var all=myCards(), st=counts(all), bi=batchInfo(), now=Date.now(), b=[0,0,0,0,0,0,0];
  all.forEach(function(c){ if(c.status!=='review') return;
    var d=Math.floor((c.due-now)/DAY); if(d>=0&&d<7) b[d]++; });
  var max=Math.max.apply(null,b.concat([1]));
  var tiles=[['Toplam kart',st.total,'var(--text)'],['Ezberlenen',st.ezber,'var(--mint)'],
    ['Yeni',st.yeni,'var(--brass)'],['Zor',st.zor,'var(--rose)'],
    ['Bugün tekrar',st.tekrar,'var(--mint)'],['Açık kademe',bi.i+1,'var(--text)']];
  m.innerHTML=
   hedefBar()+
   '<div class="grid2" style="margin:14px 0 20px">'+tiles.map(function(t){
     return '<div class="tile"><div class="n" style="color:'+t[2]+'">'+t[1]+'</div><div class="l">'+t[0]+'</div></div>';}).join('')+'</div>'+
   kademeBar()+
   '<div class="sec" style="margin-top:14px"><div class="grow">Kademe sınavı<div class="l" style="font-size:12.5px;color:var(--dim)">Açık kademedeki kelimeleri puanla sınar, tekrar takvimini bozmaz</div></div>'+
     '<button class="b-ghost" data-act="sinav-basla">Başlat</button></div>'+
   '<div class="sec"><div class="grow">Zor kelimeler<div class="l" style="font-size:12.5px;color:var(--dim)">Yıldızladıkların ve iki kezden çok unuttukların</div></div>'+
     '<button class="b-ghost" data-act="zorlari-calis">'+st.zor+' kart</button></div>'+
   '<div style="font-size:14px;color:var(--dim);margin:20px 0 12px">Önümüzdeki yedi günün tekrar yükü</div>'+
   '<div class="bars" style="margin-bottom:26px">'+b.map(function(n,i){
     return '<div><div class="t" style="color:'+(n?'var(--text)':'transparent')+'">'+(n||0)+'</div>'+
     '<div class="bar" style="height:'+Math.max(3,(n/max)*74)+'px;'+(n?'background:var(--mint);opacity:.85':'')+'"></div>'+
     '<div class="t">'+(i===0?'bugün':'+'+i)+'</div></div>';}).join('')+'</div>'+
   '<div class="tile" style="margin-bottom:14px">'+
     '<label style="margin-bottom:8px"><span>Kademe boyutu: '+S.batch+' kelime</span>'+
     '<input type="range" min="5" max="40" step="5" value="'+S.batch+'" id="lim" style="padding:0;accent-color:var(--brass)"></label>'+
     '<label style="margin-bottom:8px"><span>Günlük hedef: '+S.goal+' kart</span>'+
     '<input type="range" min="5" max="80" step="5" value="'+S.goal+'" id="hedef" style="padding:0;accent-color:var(--brass)"></label>'+
     '<p class="note" style="margin:0">Bir kademedeki kelimelerin hepsi ezberlenmeden yenileri açılmaz. Bir kelime iki kez üst üste doğru bilinip aralığı 6 güne çıkınca ezberlenmiş sayılır.</p></div>'+
   '<div class="tile" style="margin-bottom:14px">'+
     '<div style="font-size:14px;margin-bottom:8px">Yapay zekâ — isteğe bağlı</div>'+
     '<div class="modes" style="margin-bottom:14px">'+
       '<button class="'+(S.ai.saglayici==='gemini'?'on':'')+'" data-sagla="gemini">Gemini · ücretsiz</button>'+
       '<button class="'+(S.ai.saglayici==='anthropic'?'on':'')+'" data-sagla="anthropic">Claude · ücretli</button>'+
     '</div>'+
     '<label><span>API anahtarı</span><input type="password" id="aiKey" value="'+esc(S.ai.key)+'" placeholder="'+
       (S.ai.saglayici==='gemini'?'AIza...':'sk-ant-...')+'" autocomplete="off"></label>'+
     '<label><span>Model</span><input id="aiModel" value="'+esc(S.ai.model)+'"></label>'+
     '<button class="b-ghost b-wide" style="margin-bottom:10px" data-act="ai-test">'+
       (busy?'<span class="spin"></span> sınanıyor':'Bağlantıyı sına')+'</button>'+
     '<p class="note" style="margin:0">'+
     (S.ai.saglayici==='gemini'
       ? 'Anahtarı aistudio.google.com adresinden ücretsiz alırsın, kart istemez. Dakikada ve günde istek sınırı var, uzun listelerde biraz yavaş ilerler. Google ücretsiz katmandaki metinleri kendi modellerini geliştirmek için kullanabiliyor; gizli bir metin yapıştırma.'
       : 'Anahtarı console.anthropic.com adresinden alırsın, önceden kredi yüklemek gerekir. Hızlı ve sınırsıza yakın çalışır, gönderdiğin metinler eğitimde kullanılmaz.')+
     ' Anahtar sadece bu telefonda saklanır, yedek dosyasına yazılmaz.</p></div>'+
   '<div class="tile">'+
     '<div style="font-size:14px;margin-bottom:4px">Yedekleme</div>'+
     '<p class="note">Kartların bu telefonda saklanıyor. Ara sıra yedek indir.</p>'+
     '<div class="row"><button class="b-ghost" data-act="export">Yedeği indir</button>'+
     '<button class="b-ghost" data-act="import">Yedekten yükle</button></div>'+
     '<input type="file" id="file" accept=".json,application/json" class="hidden"></div>';
}
function deckSheet(){
  if(document.getElementById('sheet')){ render(); return; }
  document.getElementById('main').insertAdjacentHTML('afterbegin',
    '<div class="sheet" id="sheet">'+
    '<label><span>Yeni deste adı</span><input id="dName" placeholder="ör. Akademik İngilizce"></label>'+
    '<label><span>Seslendirme dili</span><select id="dLang">'+
      LANGS.map(function(l){return '<option value="'+l[0]+'">'+l[1]+'</option>';}).join('')+'</select></label>'+
    '<div class="row"><button class="b-solid" data-act="deck-new">Deste oluştur</button>'+
    '<button class="b-danger" data-act="deck-del">Bu desteyi sil</button>'+
    '<button class="b-ghost" data-act="deck-close">Kapat</button></div></div>');
}

/* ================= olaylar ================= */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-act],[data-grade],[data-edit],[data-del],[data-mode],[data-chip],[data-slot],[data-pick],[data-opt],[data-sopt],[data-filtre],[data-sec]');
  if(!t){ if(e.target.closest('#card')){ flipped=!flipped; render(); } return; }
  var a=t.dataset, c;
  if(a.go) return go(a.go);
  if(a.mode){ S.mode=a.mode; resetCardState(); save(); return render(); }
  if(a.filtre){ filtre=a.filtre; return render(); }
  if(a.sagla){ S.ai.saglayici=a.sagla; S.ai.model=VARMODEL[a.sagla]; S.ai.key=''; save();
    toast(a.sagla==='gemini'?'Gemini seçildi. Anahtarı yeniden gir.':'Claude seçildi. Anahtarı yeniden gir.');
    return render(); }
  if(a.pick){ var mi=document.getElementById('aM'); if(mi) mi.value=a.pick; return; }
  if(a.sec!==undefined){ var x=cikar.liste[Number(a.sec)]; x.sec=!x.sec; return render(); }
  if(a.opt!==undefined){
    if(mcq.secilen!==null) return;
    mcq.secilen=Number(a.opt); c=cur();
    var dogru=norm(mcq.secenekler[mcq.secilen])===norm(mcq.dogru);
    if(dogru&&deck().lang) speak(c.front);
    return render();
  }
  if(a.sopt!==undefined){
    if(sinav.cevap!==null) return;
    sinav.cevap=Number(a.sopt);
    c=byId(sinav.ids[sinav.i]);
    if(norm(sinav.secenek[sinav.cevap])===norm(ansSide(c))) sinav.dogru++;
    else sinav.yanlis.push(c.id);
    return render();
  }
  if(a.chip!==undefined) return harfPlace(Number(a.chip));
  if(a.slot!==undefined) return harfPull(Number(a.slot));
  if(a.grade) return answer(a.grade);
  if(a.edit){ editing=a.edit; return render(); }
  if(a.del){ S.cards=S.cards.filter(function(x){return x.id!==a.del;});
    queue=queue.filter(function(q){return q!==a.del;}); save(); return render(); }
  switch(a.act){
    case 'flip': if(qType(cur())==='kart') flipped=true; else shown=true; return render();
    case 'say': e.stopPropagation(); c=cur(); return c&&speak(c.front);
    case 'say-ex': e.stopPropagation(); c=cur(); return c&&speak(c.example);
    case 'star': c=cur(); c.star=!c.star; save();
      toast(c.star?'Zor olarak işaretlendi.':'İşaret kaldırıldı.'); return render();
    case 'tanit-ok':
      c=cur(); tanitildi[c.id]=true;
      queue=queue.slice(1).concat([c.id]); resetCardState(); return render();
    case 'ipucu': ipucu++; yazilan=(document.getElementById('typed')||{}).value||''; return render();
    case 'check':
      c=cur(); yazilan=document.getElementById('typed').value;
      typedOK=checkTyped(yazilan,ansSide(c)); shown=true;
      retype = !typedOK;
      if(typedOK&&deck().lang) speak(c.front);
      return render();
    case 'retype-ok':
      c=cur();
      var r=document.getElementById('retype').value;
      if(!checkTyped(r,ansSide(c))){ toast('Doğru yazımı bir daha dene.'); return; }
      retype=false; return answer('again');
    case 'harf-clear': c=cur(); harfInit(c); return render();
    case 'harf-give': typedOK=false; shown=true; return render();
    case 'recap':
      var bi=batchInfo();
      queue=karistir(bi.cards).map(function(x){return x.id;});
      doneCount=0; sess={dogru:0,yanlis:0,zor:[],basla:Date.now(),bitti:false}; resetCardState();
      if(!queue.length) toast('Tazelenecek kart yok.');
      return render();
    case 'zorlari-calis':
      var zor=myCards().filter(zorMu);
      if(!zor.length){ toast('Zor işaretli kelime yok.'); return; }
      queue=karistir(zor).map(function(x){return x.id;});
      sess={dogru:0,yanlis:0,zor:[],basla:Date.now(),bitti:false}; resetCardState();
      view='study'; return render();
    case 'sinav-basla': return sinavBasla();
    case 'sinav-ileri': sinav.i++; sinav.cevap=null; sinav.secenek=null; return render();
    case 'sinav-yanlislar':
      queue=karistir(sinav.yanlis.slice()); sinav=null;
      sess={dogru:0,yanlis:0,zor:[],basla:Date.now(),bitti:false}; resetCardState();
      return render();
    case 'sinav-kapat': sinav=null; queue=[]; sess.bitti=false; return render();
    case 'mode-tek': addMode='tek'; return render();
    case 'mode-toplu': addMode='toplu'; return render();
    case 'mode-metin': addMode='metin'; return render();
    case 'metin-cikar': return metinCikar();
    case 'metin-ekle': return metinEkle();
    case 'metin-iptal': cikar=null; return render();
    case 'enr-start': return enrichRun();
    case 'enr-stop': enr.cancel=true; return toast('Sıradaki grup bitince duracak.');
    case 'ai-fill': return aiFill();
    case 'ai-test': return aiTest();
    case 'save-one': return saveOne();
    case 'save-bulk': return saveBulk();
    case 'commit':
      c=byId(editing);
      var f=document.getElementById('eF').value.trim(), b=document.getElementById('eB').value.trim();
      if(!f||!b){ toast('Kelime ve anlamı boş olamaz.'); return; }
      c.front=f; c.back=b; c.example=document.getElementById('eE').value.trim();
      c.exTr=document.getElementById('eT').value.trim();
      c.emoji=document.getElementById('eM').value.trim();
      editing=null; save(); return render();
    case 'reset-card':
      c=byId(editing);
      c.ease=2.5; c.interval=0; c.reps=0; c.lapses=0; c.status='new'; c.due=Date.now();
      editing=null; queue=[]; sess.bitti=false; save(); toast('Kart baştan öğrenilecek.'); return render();
    case 'cancel': editing=null; return render();
    case 'deck-new':
      var n=document.getElementById('dName').value.trim();
      if(!n){ toast('Desteye bir ad ver.'); return; }
      var nd={id:uid(),name:n,lang:document.getElementById('dLang').value};
      S.decks.push(nd); S.active=nd.id; queue=[]; save(); addMode='tek'; return go('add');
    case 'deck-del':
      if(S.decks.length<=1){ toast('Son desteyi silemezsin.'); return; }
      S.cards=S.cards.filter(function(x){return x.deckId!==S.active;});
      S.decks=S.decks.filter(function(d){return d.id!==S.active;});
      S.active=S.decks[0].id; queue=[]; save(); toast('Deste silindi.'); return go('study');
    case 'deck-close': return render();
    case 'export':
      var blob=new Blob([JSON.stringify({decks:S.decks,cards:S.cards},null,2)],{type:'application/json'});
      var url=URL.createObjectURL(blob), a2=document.createElement('a');
      a2.href=url; a2.download='kelimelik-yedek-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a2); a2.click(); a2.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
      return toast('Yedek indirildi.');
    case 'import': return document.getElementById('file').click();
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='deckSel'){ S.active=e.target.value; queue=[]; sinav=null; cikar=null;
    doneCount=0; sess.bitti=false; save(); render(); }
  if(e.target.id==='lim'){ S.batch=Number(e.target.value); queue=[]; save(); render(); }
  if(e.target.id==='hedef'){ S.goal=Number(e.target.value); save(); render(); }
  if(e.target.id==='file'){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){ try{
        var d=JSON.parse(r.result);
        if(!Array.isArray(d.decks)||!Array.isArray(d.cards)) throw 0;
        S.decks=d.decks; S.cards=d.cards;
        S.cards.forEach(function(c){ if(c.emoji===undefined) c.emoji='';
          if(c.exTr===undefined) c.exTr=''; if(c.star===undefined) c.star=false; });
        S.active=d.decks[0].id; queue=[]; save(); toast('Yedek geri yüklendi.'); go('study');
      }catch(err){ toast('Bu dosya geçerli bir Kelimelik yedeği değil.'); } };
    r.readAsText(f);
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){ search=e.target.value; var pos=e.target.selectionStart;
    listView(document.getElementById('main'));
    var q=document.getElementById('q'); q.focus(); q.setSelectionRange(pos,pos); }
  if(e.target.id==='aiKey'){ S.ai.key=e.target.value.trim(); save(); }
  if(e.target.id==='aiModel'){ S.ai.model=e.target.value.trim(); save(); }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='typed'){ e.preventDefault();
    var c=cur(); yazilan=e.target.value; typedOK=checkTyped(yazilan,ansSide(c)); shown=true;
    retype=!typedOK; if(typedOK&&deck().lang) speak(c.front); render(); return; }
  if(view!=='study'||sinav||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var ct=cur(); if(!ct) return;
  if(e.code==='Space'){ e.preventDefault();
    if(qType(ct)==='kart') flipped=!flipped; else shown=true; render(); }
  else if((flipped||shown)&&e.key==='1') answer('again');
  else if((flipped||shown)&&e.key==='2') answer('good');
  else if((flipped||shown)&&e.key==='3') answer('easy');
});
document.getElementById('deckBtn').addEventListener('click',deckSheet);
document.getElementById('revBtn').addEventListener('click',function(){
  S.reverse=!S.reverse; queue=[]; sess.bitti=false; resetCardState(); save(); render();
  toast(S.reverse?'Önce anlam gösterilecek.':'Önce kelime gösterilecek.');
});

load(); render();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
